<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>DBS Price Prediction</h2>

        <form action="{{ url_for('dbs_prediction') }}" method="post">
            <label for="exchange-rate">Enter the exchange rate in SGD per USD</label>
            <input id="exchange-rate" type="number" step="any" min="0" name="q"
                   value="{{ exchange_rate | default('') }}" required>
            <input type="submit" value="Enter">
        </form>

        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}
        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>
    </div>
</body>
